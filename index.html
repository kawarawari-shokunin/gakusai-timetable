<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBA学祭ステージ2026 タイムテーブル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TBA学祭ステージ2026</h1>
        <p>タイムテーブル</p>
    </header>

    <main>
        <!-- 日付切り替えタブ -->
        <nav class="tabs" id="tabs-container"></nav>

        <!-- タグフィルター -->
        <div class="filters" id="filters-container"></div>

        <!-- システムメッセージ表示エリア（日跨ぎ時など） -->
        <div id="message-container"></div>

        <!-- 番組表タイムライン -->
        <div class="timeline" id="timeline-container"></div>
    </main>

    <!-- デバッグ用パネル（URLに #debug をつけた時のみ表示されます） -->
    <div id="debug-panel" class="debug-panel">
        <div class="debug-header">🛠 デバッグツール</div>
        <div class="debug-content">
            <div class="debug-row">
                <label>開始時刻:</label>
                <input type="datetime-local" id="debug-time">
            </div>
            <div class="debug-row">
                <label><input type="checkbox" id="debug-speed"> 30倍速で進める</label>
            </div>
            <div class="debug-actions">
                <button id="debug-apply" class="debug-btn">適用</button>
                <button id="debug-reset" class="debug-btn reset">リセット</button>
            </div>
            <div class="debug-now">仮想現在時刻: <br><span id="debug-now-display">--</span></div>
        </div>
    </div>

    <!-- アプリケーションロジック -->
    <script src="app.js"></script>
</body>
</html>
